name: Automated Data Sync

on:
  # Automatic schedules disabled - manual trigger only
  # schedule:
  #   # Production: every 1 hour
  #   - cron: '0 * * * *'
  #   # Preprod: every 3 hours (at minute 5 to avoid collision)
  #   - cron: '5 */3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      environment:
        description: 'Environment to sync'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - production
          - preprod

jobs:
  sync-production:
    name: Sync Production
    runs-on: ubuntu-latest
    # Run on 1-hour schedule OR manual trigger for production/all
    if: github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'production' || github.event.inputs.environment == 'all')
    
    steps:
      - name: Trigger Sync API (Production)
        run: |
          echo "🔄 Starting sync for Production..."
          echo "📡 Target: https://jubile-cmr.com/api/cron/sync"
          
          RESPONSE=$(curl -sL -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://jubile-cmr.com/api/cron/sync")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Sync failed for Production with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Production sync completed successfully!"

      - name: Log Result
        if: always()
        run: |
          echo "Production sync finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

  sync-preprod:
    name: Sync Preprod
    runs-on: ubuntu-latest
    # Run on 3-hour schedule OR manual trigger for preprod/all
    if: github.event.schedule == '5 */3 * * *' || github.event_name == 'workflow_dispatch' && (github.event.inputs.environment == 'preprod' || github.event.inputs.environment == 'all')
    
    steps:
      - name: Trigger Sync API (Preprod)
        run: |
          echo "🔄 Starting sync for Preprod..."
          echo "📡 Target: https://preprod.jubile-cmr.com/api/cron/sync"
          
          RESPONSE=$(curl -sL -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://preprod.jubile-cmr.com/api/cron/sync")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Sync failed for Preprod with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Preprod sync completed successfully!"

      - name: Log Result
        if: always()
        run: |
          echo "Preprod sync finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
