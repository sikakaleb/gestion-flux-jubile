name: Automated Data Sync

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    name: Sync Google Sheet to Database
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Sync API
        run: |
          echo "🔄 Starting automated sync..."
          
          RESPONSE=$(curl -sL -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "https://gestion-flux-jubile.vercel.app/api/cron/sync")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Sync failed with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Sync completed successfully!"

      - name: Log Result
        if: always()
        run: |
          echo "Sync job finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
