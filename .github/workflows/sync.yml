name: Automated Data Sync

on:
  schedule:
    # Run every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  sync:
    name: Sync ${{ matrix.env }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: Preprod
            url: https://preprod.jubile-cmr.com/api/cron/sync
          - env: Production
            url: https://jubile-cmr.com/api/cron/sync
    
    steps:
      - name: Trigger Sync API (${{ matrix.env }})
        run: |
          echo "🔄 Starting sync for ${{ matrix.env }}..."
          echo "📡 Target: ${{ matrix.url }}"
          
          RESPONSE=$(curl -sL -w "\n%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            "${{ matrix.url }}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Response Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Sync failed for ${{ matrix.env }} with HTTP $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ ${{ matrix.env }} sync completed successfully!"

      - name: Log Result
        if: always()
        run: |
          echo "${{ matrix.env }} sync finished at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
